name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The keyword dictionary lives outside the repo on purpose, so CI runs
      # with built-in rules only. Those cover internal links, local paths,
      # withheld vocabulary and credentials — the things that actually must
      # never ship.
      - name: leak check
        run: node _tools/leak-check.mjs

      - name: nav is in sync
        run: node _tools/build-nav.mjs --check

      - name: agenda blocks are in sync
        run: node _tools/build-agenda.mjs --check

      # Keep this gate off until the chapter sources catch up. Twenty chapters
      # carry source-check results in their HTML: the header badge and the notes
      # under 残っている問い. Neither the Markdown nor this builder holds them, so
      # --check reads the HTML as stale and a rebuild would delete the results.
      # Move them into the front matter and body, teach build-textbook.mjs to
      # render them, then drop continue-on-error.
      - name: textbook chapters are in sync
        run: node _tools/build-textbook.mjs --check
        continue-on-error: true

      - name: reports meet the quality gate
        run: node _tools/verify-report.mjs
