<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"

<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1a1c22; --sub:#5b6270; --line:#e3e6ec;
    --vc:#7c3aed; --public:#2563eb; --private:#0d9488; --landmark:#d97706;
    --accent:#111827;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;color:var(--ink);background:var(--bg)}
  #app{display:flex;flex-direction:column;height:100%}

  header{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:14px}
  header h1{font-size:18px;margin:0;letter-spacing:.02em;font-weight:700}
  header h1 span{color:var(--sub);font-weight:400;font-size:13px;margin-left:8px}
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
  #search{border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:13px;width:190px;outline:none;background:#fbfbfc}
  #search:focus{border-color:#9aa2b1}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer;color:var(--ink);transition:.12s}
  .btn:hover{background:#f0f1f4}
  .filters{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer;user-select:none;transition:.12s}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.off{opacity:.38}
  .chip:hover{background:#f0f1f4}

  #timeline{display:flex;align-items:center;gap:12px;padding:9px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  #timeline input[type=range]{flex:1;min-width:160px;accent-color:#111;cursor:pointer}
  #yearLabel{font-weight:700;font-size:15px;min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
  .tgl{font-size:12.5px;color:var(--sub);display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
  .era{flex-basis:100%;font-size:12.5px;color:var(--sub);line-height:1.55}
  .era b{color:var(--ink)}
  .leaflet-tooltip.cog-tip{background:#111;color:#fff;border:none;font-size:10px;font-weight:700;padding:1px 7px;box-shadow:none;border-radius:5px}
  .leaflet-tooltip-top.cog-tip::before{border-top-color:#111}

  #main{flex:1;display:flex;min-height:0}
  #map{flex:1;min-width:0}
  aside{width:380px;max-width:44vw;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:20px 20px 40px}

  .count{font-size:12px;color:var(--sub)}
  .badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:3px 9px;border-radius:6px;letter-spacing:.04em}
  h2.name{font-size:20px;margin:12px 0 4px;line-height:1.3}
  .meta{font-size:13px;color:var(--sub);margin:2px 0}
  .metric{font-size:15px;font-weight:700;margin:10px 0 2px}
  .headline{font-size:14px;font-weight:600;margin:14px 0 6px;color:var(--accent)}
  .episode{font-size:14px;line-height:1.85;color:#2a2d36}
  .people{font-size:12.5px;color:var(--sub);margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
  .kv{display:flex;gap:8px;font-size:13px;margin:3px 0}
  .kv b{color:var(--sub);font-weight:600;min-width:64px}

  .guide h3{font-size:15px;margin:18px 0 6px}
  .guide p{font-size:13.5px;line-height:1.8;color:#333;margin:6px 0}
  .guide .lead{font-size:13.5px;color:var(--sub);line-height:1.75}
  .region{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:12px 0}
  .region b{font-size:13.5px}
  .region small{color:var(--sub);font-size:12.5px;display:block;margin-top:2px;line-height:1.7}
  .legend-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:5px 0}
  .legend-row .dot{width:11px;height:11px;border-radius:50%}
  .hint{font-size:12px;color:var(--sub);background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.7;margin-top:8px}
  .back{font-size:12.5px;color:var(--public);cursor:pointer;display:inline-block;margin-bottom:4px}
  .region-label{background:rgba(255,255,255,.72);border:1px solid rgba(0,0,0,.08);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;color:#3a3f4b;white-space:nowrap;letter-spacing:.03em}

  @media (max-width:820px){
    #main{flex-direction:column}
    aside{width:100%;max-width:100%;height:46%;border-left:none;border-top:1px solid var(--line)}
    #map{height:54%}
  }
</style>
</head>

  {name:"Y Combinator", type:"vc", lat:37.4003, lng:-122.0636, area:"Pioneer Way, Mountain View", founded:"2005", metric:"Airbnb・Stripe・Coinbase・DoorDash", sector:"アクセラレータ",

  {name:"HP Garage（シリコンバレー発祥の地）", type:"landmark", lat:37.4419, lng:-122.1526, area:"367 Addison Ave, Palo Alto", founded:"1938", metric:"1938年 / カリフォルニア州史跡", sector:"歴史",

  {name:"Xerox PARC", type:"landmark", lat:37.4028, lng:-122.1470, area:"3333 Coyote Hill Rd, Palo Alto", founded:"1970", metric:"GUI・マウス・イーサネットの発祥", sector:"歴史（研究所）",

   people:"Alan Kay / Butler Lampson ら"},
  {name:"Shockley Semiconductor（跡地）", type:"landmark", lat:37.4058, lng:-122.1088, area:"391 San Antonio Rd, Mountain View", founded:"1956", metric:"シリコンを持ち込んだ最初の会社", sector:"歴史（半導体）",

   people:"William Shockley / 裏切りの8人"},
  {name:"Fairchild Semiconductor（原点）", type:"landmark", lat:37.4197, lng:-122.1131, area:"844 E Charleston Rd, Palo Alto", founded:"1957", metric:"集積回路の実用化", sector:"歴史（半導体）",

  {name:"Steve Jobs's Garage", type:"landmark", lat:37.3549, lng:-122.0489, area:"2066 Crist Drive, Los Altos", founded:"1976", metric:"Apple I 誕生の地", sector:"歴史",

  {name:"Google Garage（Wojcicki 邸）", type:"landmark", lat:37.4553, lng:-122.1817, area:"232 Santa Margarita Ave, Menlo Park", founded:"1998", metric:"月1,700ドルの間借りガレージ", sector:"歴史",

  {name:"University Ave（PayPal マフィアの巣）", type:"landmark", lat:37.4442, lng:-122.1631, area:"University Ave, Palo Alto", founded:"2002〜", metric:"1社から派生した起業家群", sector:"歴史",

  {name:"Sand Hill Road", type:"landmark", lat:37.4210, lng:-122.2010, area:"Menlo Park", founded:"1972〜", metric:"全米屈指の賃料の商業地", sector:"歴史（資本の中枢）",

   people:"—"},
  {name:"Computer History Museum", type:"landmark", lat:37.4141, lng:-122.0770, area:"1401 N Shoreline Blvd, Mountain View", founded:"1996", metric:"計算機史の総本山", sector:"歴史（博物館）",

  {name:"Nvidia", type:"public", lat:37.3705, lng:-121.9636, area:"Santa Clara", founded:"1993", metric:"時価総額 約$5.0兆（世界最大級）", sector:"半導体（GPU）",

  {name:"Oracle", type:"public", lat:37.5304, lng:-122.2637, area:"Redwood City（本社は米南部へ移転）", founded:"1977", metric:"時価総額 約$8,000億超", sector:"データベース／クラウド",

  {name:"Adobe", type:"public", lat:37.3305, lng:-121.8920, area:"San Jose", founded:"1982", metric:"時価総額 約$1,800億", sector:"クリエイティブ／文書ソフト",

/* ---------- Map init ---------- */
const map = L.map('map',{zoomControl:true, scrollWheelZoom:true}).setView([37.55,-122.15], 10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:19
}).addTo(map);

/* Region labels */
REGIONS.forEach(r=>{
  L.marker([r.lat,r.lng],{
    interactive:false,
    icon:L.divIcon({className:'', html:'<div class="region-label">'+r.name+'</div>', iconSize:[0,0]})
  }).addTo(map);
});

/* ---------- Markers ---------- */
const records = [];
DATA.forEach((e,i)=>{
  e._id = i;
  const c = TYPES[e.type].color;
  const m = L.circleMarker([e.lat,e.lng],{
    radius:7, weight:2, color:'#fff', fillColor:c, fillOpacity:1
  });
  m.bindTooltip(e.name,{direction:'top',offset:[0,-6]});
  m.on('click',()=>selectEntry(e._id));
  records.push({entry:e, marker:m});
});

/* ---------- Filters ---------- */
const active = new Set(Object.keys(TYPES));
const filtersEl = document.getElementById('filters');
Object.keys(TYPES).forEach(k=>{
  const chip = document.createElement('span');
  chip.className='chip';
  chip.dataset.type=k;
  chip.innerHTML='<span class="dot" style="background:'+TYPES[k].color+'"></span>'+TYPES[k].label;
  chip.onclick=()=>{
    if(active.has(k)){active.delete(k);chip.classList.add('off');}
    else{active.add(k);chip.classList.remove('off');}
    applyFilters();
  };
  filtersEl.appendChild(chip);
});

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', applyFilters);

function applyFilters(){
  const q = searchEl.value.trim().toLowerCase();
  const curYear = (typeof yearSlider!=='undefined' && yearSlider) ? +yearSlider.value : 2026;
  let count=0;
  records.forEach(r=>{
    const e=r.entry;
    const inYear = (e._year==null) || (e._year<=curYear);
    const hit = active.has(e.type) && inYear && (q===''||
      e.name.toLowerCase().includes(q) ||
      (e.area||'').toLowerCase().includes(q) ||
      (e.sector||'').toLowerCase().includes(q));
    if(hit){
      if(!map.hasLayer(r.marker)) r.marker.addTo(map);
      const recent = e._year && (curYear - e._year) <= 8;
      r.marker.setRadius(recent?9:6);
      r.marker.setStyle({weight:recent?3:2});
      count++;
    }
    else{ if(map.hasLayer(r.marker)) map.removeLayer(r.marker); }
  });
  updateGuideCount(count);
}

/* ---------- Panel rendering ---------- */
const panel = document.getElementById('panel');

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function selectEntry(id){
  const e = DATA[id];
  const t = TYPES[e.type];
  map.setView([e.lat,e.lng], Math.max(map.getZoom(),12), {animate:true});
  records[id].marker.openTooltip();
  panel.innerHTML =
    '<span class="back" id="backLink">&larr; 地理ガイドに戻る</span>'+
    '<div><span class="badge" style="background:'+t.color+'">'+t.label+'</span></div>'+
    '<h2 class="name">'+esc(e.name)+'</h2>'+
    '<div class="metric" style="color:'+t.color+'">'+esc(e.metric)+'</div>'+
    '<div class="kv"><b>所在</b><span>'+esc(e.area)+'</span></div>'+
    '<div class="kv"><b>創業</b><span>'+esc(e.founded)+'</span></div>'+
    '<div class="kv"><b>領域</b><span>'+esc(e.sector)+'</span></div>'+
    '<div class="headline">'+esc(e.headline)+'</div>'+
    '<div class="episode">'+esc(e.episode)+'</div>'+
    '<div class="people"><b>キーパーソン</b>　'+esc(e.people)+'</div>';
  document.getElementById('backLink').onclick = showGuide;
  panel.scrollTop = 0;
}

function updateGuideCount(n){
  const el = document.getElementById('cnt');
  if(el) el.textContent = n;
}

/* ---------- Buttons ---------- */
document.getElementById('guideBtn').onclick = showGuide;
document.getElementById('randomBtn').onclick = ()=>{
  const visible = records.filter(r=>map.hasLayer(r.marker));
  const pool = visible.length? visible : records;
  const pick = pool[Math.floor(Math.random()*pool.length)];
  selectEntry(pick.entry._id);
};

/* ---------- Timeline (1938 -> 2026) ---------- */
function parseYear(s){ const m=(s||'').match(/\d{4}/); return m?+m[0]:null; }
DATA.forEach(e=>{ e._year = parseYear(e.founded); });

const T_START=1938, T_END=2026;
const centroidByYear={};
for(let y=T_START;y<=T_END;y++){
  const pts=DATA.filter(d=>d._year && d._year<=y);
  if(pts.length){
    const la=pts.reduce((a,d)=>a+d.lat,0)/pts.length;
    const ln=pts.reduce((a,d)=>a+d.lng,0)/pts.length;
    centroidByYear[y]=[la,ln];
  }
}

const cogTrail=L.polyline([],{color:'#111',weight:2,opacity:.5,dashArray:'4 5',interactive:false});
const cogDot=L.circleMarker([37.42,-122.1],{radius:8,color:'#fff',weight:3,fillColor:'#111',fillOpacity:.9,interactive:false});
cogDot.bindTooltip('重心',{permanent:true,direction:'top',offset:[0,-8],className:'cog-tip'});

const yearSlider=document.getElementById('yearSlider');
const yearLabel=document.getElementById('yearLabel');
const eraLabel=document.getElementById('eraLabel');
const playBtn=document.getElementById('playBtn');
const cogToggle=document.getElementById('cogToggle');

function eraFor(y){
  if(y<1956) return '<b>発祥</b>　Stanford とガレージ（HP）から始まった';
  if(y<1970) return '<b>半導体の誕生</b>　Shockley→Fairchild→Intel、シリコンが谷の名になる（重心が南へ）';
  if(y<1980) return '<b>VCとパソコン</b>　Sand Hill Road が生まれ、Apple・Xerox PARC の時代';
  if(y<1995) return '<b>ネットワークとワークステーション</b>　Cisco・Adobe・Oracle が南で育つ';
  if(y<2005) return '<b>ドットコム</b>　eBay・PayPal・Google と検索の時代';
  if(y<2012) return '<b>Web2.0とソーシャル、SFへ北上開始</b>　YC・Facebook・Uber・Airbnb';
  if(y<2020) return '<b>モバイル/クラウド、重心がSFへ</b>　Stripe・Databricks・Figma';
  return '<b>生成AIの爆発</b>　OpenAI・Anthropic・xAI・Cursor が北の SF に集中';
}

function renderCentroid(y){
  const pos=centroidByYear[y]||centroidByYear[T_END];
  const coords=[];
  for(let yy=T_START;yy<=y;yy++){ if(centroidByYear[yy]) coords.push(centroidByYear[yy]); }
  cogTrail.setLatLngs(coords);
  cogDot.setLatLng(pos).setTooltipContent('重心 '+y);
}
function setCogVisible(on){
  if(on){
    if(!map.hasLayer(cogTrail)) cogTrail.addTo(map);
    if(!map.hasLayer(cogDot)) cogDot.addTo(map);
    renderCentroid(+yearSlider.value);
  } else {
    if(map.hasLayer(cogTrail)) map.removeLayer(cogTrail);
    if(map.hasLayer(cogDot)) map.removeLayer(cogDot);
  }
}
function setYear(y){
  yearLabel.textContent=y;
  eraLabel.innerHTML=eraFor(y);
  applyFilters();
  if(cogToggle.checked) renderCentroid(y);
}

let playTimer=null;
function stopPlay(){ if(playTimer){clearInterval(playTimer);playTimer=null;playBtn.textContent='再生';} }
playBtn.onclick=()=>{
  if(playTimer){ stopPlay(); return; }
  if(+yearSlider.value>=T_END){ yearSlider.value=T_START; }
  playBtn.textContent='停止';
  setYear(+yearSlider.value);
  playTimer=setInterval(()=>{
    let y=+yearSlider.value;
    if(y>=T_END){ stopPlay(); return; }
    y++; yearSlider.value=y; setYear(y);
  },110);
};
yearSlider.addEventListener('input',()=>{ stopPlay(); setYear(+yearSlider.value); });
cogToggle.addEventListener('change',()=>setCogVisible(cogToggle.checked));

/* ---------- Boot ---------- */
showGuide();
setCogVisible(true);
setYear(T_END);
setTimeout(()=>map.invalidateSize(), 150);
window.addEventListener('resize', ()=>map.invalidateSize());
window.addEventListener('load', ()=>{ map.invalidateSize(); });
</script>
</body>
</html>
